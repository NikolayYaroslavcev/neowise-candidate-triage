<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <div id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа (проверьте перед отправкой)</label>
    <textarea id="draft" rows="4"></textarea>
  </div>
  <script type="module">
    const TOPICS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const MESSAGES = {
      invalid_input: "Введите текст заявки.",
      manual_review: "AI не смог разобрать эту заявку. Определите тему и напишите ответ вручную.",
      failed: "Сервис не ответил. Попробуйте ещё раз или разберите заявку вручную.",
    };
    const $ = (selector) => document.querySelector(selector);
    const form = $("form");
    const button = form.querySelector("button");
    let lastRequest = 0;

    function show(message, data) {
      $("#status").textContent = message;
      $("#result").hidden = !data;
      $("#topic").textContent = data ? TOPICS[data.topic] : "";
      $("#draft").value = data ? data.draft : "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = $("#message").value;
      if (!text.trim()) return show(MESSAGES.invalid_input);

      const request = ++lastRequest;
      show("Разбираем заявку…");
      button.disabled = true;
      let data;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        data = await reply.json();
      } catch {
        data = { status: "failed" };
      }
      if (request !== lastRequest) return; // a newer request owns the screen
      button.disabled = false;
      if (data.status === "ready") show("", data);
      else show(MESSAGES[data.status] ?? MESSAGES.failed);
    });
  </script>
</body>
</html>
